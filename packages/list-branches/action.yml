name: 'List branches on repository'
description: 'You can customize the message and the channel id.'
inputs:
  branches_list:
    description: 'Keep branch given in list (separate by space)'
    required: true
    default: 'master dev release-.*'
outputs:
  branches:
    description: "Json object who contains each branch"
    value: ${{ steps.extract_branches.outputs.branches }}
runs:
  using: "composite"
  steps:
    - name: List branches
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BRANCHES_LIST: ${{ inputs.branches_list }}
      run: |
        # Create regex from input: "master dev release-.*" -> "master|dev|release-.*"
        regex=$(echo "$BRANCHES_LIST" | tr -s ' ' '|')

        # grep -x anchors the match on the whole branch name, jq builds the json array
        branchList=$(gh api "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --paginate --jq '.[].name' \
          | { grep -Ex "$regex" || true; } \
          | jq -Rsc 'split("\n") | map(select(length > 0))')

        echo "Computed branch list: $branchList"
        # set the output
        echo "branches=$branchList" >> "$GITHUB_OUTPUT"
      id: extract_branches
